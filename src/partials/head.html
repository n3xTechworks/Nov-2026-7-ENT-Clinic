<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0A6B66">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem('tridya.theme'),r=localStorage.getItem('tridya.dir');if(t==='dark')d.setAttribute('data-theme','dark');if(r==='rtl')d.setAttribute('dir','rtl');}catch(e){}if(!navigator.webdriver&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))d.classList.add('motion');})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;650;700;800&display=swap">
  <link rel="stylesheet" href="css/site.css">
{{{page_css}}}{{{preload_tag}}}</head>
